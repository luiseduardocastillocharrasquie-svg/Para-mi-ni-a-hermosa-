<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Para mi niña hermosa 🥺🌹🪐♾️</title>
<style>
 *{box-sizing:border-box}
 html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020008;color:white;font-family:Georgia,"Times New Roman",serif}
 body{touch-action:manipulation}
 canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
 #space{z-index:0}
 #heart{z-index:1}
 .vignette{position:fixed;inset:0;z-index:2;pointer-events:none;background:
  radial-gradient(circle at 50% 48%,transparent 0 30%,rgba(0,0,0,.12) 55%,rgba(0,0,0,.72) 100%)}
 .top{
  position:fixed;top:22px;left:0;right:0;z-index:5;text-align:center;
  padding:0 18px;pointer-events:none;
 }
 .title{
  margin:0;font-size:clamp(28px,8vw,54px);font-weight:500;letter-spacing:1px;
  text-shadow:0 0 8px #ff9bb8,0 0 25px #ff2d68,0 0 55px #ff0a55;
  animation:pulse 3s ease-in-out infinite;
 }
 .subtitle{margin-top:7px;font-size:clamp(12px,3.4vw,17px);letter-spacing:2px;color:#ffdce7;opacity:.9}
 @keyframes pulse{50%{transform:scale(1.035);text-shadow:0 0 12px #fff,0 0 30px #ff3e75,0 0 70px #ff0a55}}
 #message{
  position:fixed;left:50%;top:77%;transform:translate(-50%,-50%);
  z-index:6;width:min(88vw,560px);text-align:center;padding:13px 18px;
  border:1px solid rgba(255,170,195,.3);border-radius:22px;
  background:rgba(20,0,13,.34);backdrop-filter:blur(5px);
  color:#fff1f5;font-size:clamp(14px,4vw,20px);line-height:1.45;
  text-shadow:0 0 10px rgba(255,90,140,.8);
  opacity:0;transition:opacity .8s ease;pointer-events:none;
 }
 #hint{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:7;
  font-family:Arial,sans-serif;font-size:11px;letter-spacing:1.5px;color:#ffd5e1;
  opacity:.65;white-space:nowrap;pointer-events:none;
 }
 #counter{
  position:fixed;top:88px;right:14px;z-index:7;font-family:Arial,sans-serif;
  font-size:10px;color:#ffdbe5;opacity:.55;letter-spacing:1px
 }
 .intro{
  position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle,#210015,#050008 65%,#000);
  transition:opacity 1.2s ease,visibility 1.2s;
 }
 .intro.hide{opacity:0;visibility:hidden;pointer-events:none}
 .card{
  width:min(88vw,460px);padding:34px 24px;text-align:center;border-radius:28px;
  border:1px solid rgba(255,150,180,.35);
  background:rgba(30,0,18,.65);box-shadow:0 0 45px rgba(255,25,95,.22);
 }
 .card .big{font-size:52px;filter:drop-shadow(0 0 15px #ff2c6a)}
 .card h2{font-size:28px;font-weight:500;margin:12px 0 8px}
 .card p{font-family:Arial,sans-serif;font-size:14px;line-height:1.6;color:#ffdce7}
 button{
  border:0;border-radius:999px;padding:13px 26px;margin-top:12px;
  color:white;background:linear-gradient(135deg,#b30048,#ff3976);
  font-size:15px;font-weight:bold;box-shadow:0 0 24px rgba(255,35,100,.45);
 }
</style>
</head>
<body>
<canvas id="space"></canvas>
<canvas id="heart"></canvas>
<div class="vignette"></div>

<div class="intro" id="intro">
 <div class="card">
  <div class="big">🥺🌹🪐♾️</div>
  <h2>Para mi niña hermosa</h2>
  <p>Hay un pequeño universo preparado especialmente para ti.<br>Entra y descubre lo que hay dentro.</p>
  <button id="enter">Entrar al universo </button>
 </div>
</div>

<div class="top">
 <h1 class="title">Para mi niña hermosa 🥺🌹</h1>
 <div class="subtitle">un universo entero no alcanza para todo lo que significas 🪐♾️</div>
</div>

<div id="counter">MENSAJES EN EL UNIVERSO: ∞</div>
<div id="message"></div>
<div id="hint">Toca la pantalla para descubrir otro mensaje </div>

<script>
const space=document.getElementById('space');
const heart=document.getElementById('heart');
const s=space.getContext('2d');
const h=heart.getContext('2d');

let W=innerWidth,H=innerHeight,DPR=Math.min(devicePixelRatio||1,2);
function resize(){
 W=innerWidth;H=innerHeight;
 for(const c of [space,heart]){c.width=W*DPR;c.height=H*DPR;c.style.width=W+'px';c.style.height=H+'px'}
 s.setTransform(DPR,0,0,DPR,0,0);h.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize',resize);resize();

const messages=[
"Desde que llegaste a mi vida, muchas cosas se sienten más bonitas. 🥺🌹",
"Si pudiera regalarte algo infinito, te regalaría todo un universo para que nunca te falten estrellas. 🪐",
"Te elegiría una y otra vez, incluso entre millones de personas. ♾️",
"Quiero que nunca olvides lo especial, valiosa y querida que eres para mí. 🥺",
"Mi niña hermosa, gracias por existir y por formar parte de mi vida. 🌹",
"Hay personas que llegan y cambian un momento; tú llegaste y cambiaste mi mundo. 🪐",
"Si el amor pudiera medirse en estrellas, el cielo se quedaría pequeño. ",
"Quiero seguir construyendo recuerdos bonitos contigo, paso a paso. ♾️",
"Tu sonrisa merece todos los amaneceres bonitos del mundo. 🌹",
"Entre tantos caminos, me alegra muchísimo que nuestras vidas se hayan encontrado. 🥺",
"No necesito un universo perfecto; me basta con tener momentos bonitos a tu lado. 🪐",
"Que nunca te falte una razón para sonreír y recordar lo mucho que te quieren. 🌹",
"Eres una de esas personas que hacen que un día normal pueda convertirse en un recuerdo especial.",
"Si miras las estrellas, recuerda que este pequeño universo fue hecho pensando en ti. 🥺🌹🪐♾️",
"Lo más bonito de este universo no está en las estrellas: está en los recuerdos que construimos.",
"Quiero que cada vez que veas una rosa recuerdes que mereces cosas bonitas. 🌹",
"Hay mensajes que terminan, pero este universo tiene uno que no termina: siempre habrá una razón para valorarte. ♾️",
"Gracias por cada risa, cada conversación y cada momento que has compartido conmigo.",
"Si pudiera guardar un deseo dentro de cada estrella, todos tendrían tu nombre. 🪐",
"Mi niña hermosa, nunca dudes de lo importante que eres para mí. 🥺",
"Este corazón tiene miles de partículas, pero ninguna alcanza para representar todo lo bonito que siento por ti.",
"En este universo hay millones de estrellas, pero hoy todas tienen una misión: recordarte que eres especial. 🌹",
"Quiero que cuando estés feliz, este universo te acompañe; y cuando tengas un día difícil, te recuerde que no estás sola.",
"Una vida entera puede parecer mucho tiempo, pero algunos recuerdos bonitos hacen que cada instante valga la pena.",
"Y si alguna vez se apagan las estrellas, todavía quedarán todos los momentos bonitos que llevamos en la memoria. ♾️"
];

let shown=0;
function showMessage(){
 const m=messages[shown%messages.length]; shown++;
 const box=document.getElementById('message');
 box.style.opacity=0;
 setTimeout(()=>{box.textContent=m;box.style.opacity=1},350);
}
document.body.addEventListener('click',e=>{
 if(e.target.id==='enter')return;
 burst(e.clientX,e.clientY);
 showMessage();
});
document.getElementById('enter').onclick=()=>{
 document.getElementById('intro').classList.add('hide');
 showMessage();
};

const stars=Array.from({length:230},()=>({
 x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+.2,
 a:Math.random(),speed:Math.random()*.018+.004,phase:Math.random()*Math.PI*2
}));
const dust=Array.from({length:90},()=>({
 a:Math.random()*Math.PI*2,r:Math.random()*Math.min(W,H)*.55,
 z:Math.random()*1,spin:(Math.random()-.5)*.0015
}));

function drawSpace(t){
 s.clearRect(0,0,W,H);
 const g=s.createRadialGradient(W/2,H/48,0,W/2,H/2,Math.max(W,H)*.8);
 g.addColorStop(0,'rgba(55,0,35,.55)');g.addColorStop(.42,'rgba(18,0,28,.3)');g.addColorStop(1,'rgba(0,0,5,.9)');
 s.fillStyle=g;s.fillRect(0,0,W,H);

 for(const p of stars){
  const a=.2+.8*(.5+.5*Math.sin(t*p.speed*60+p.phase));
  s.globalAlpha=a;
  s.fillStyle='#ffd8e5';s.beginPath();s.arc(p.x,p.y,p.r,0,Math.PI*2);s.fill();
 }
 s.globalAlpha=1;

 s.save();s.translate(W/2,H/2+20);
 for(const d of dust){
  d.a+=d.spin;
  const x=Math.cos(d.a)*d.r*(1+d.z*.4);
  const y=Math.sin(d.a)*d.r*.43;
  s.globalAlpha=.12+d.z*.28;
  s.fillStyle='#ff6b9d';s.beginPath();s.arc(x,y,1+d.z*2,0,Math.PI*2);s.fill();
 }
 s.restore();
 requestAnimationFrame(drawSpace);
}
requestAnimationFrame(drawSpace);

function heartPoint(t,scale){
 const x=16*Math.pow(Math.sin(t),3);
 const y=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
 return [W/2+x*scale,H/2+20+y*scale];
}
const particles=[];
for(let i=0;i<900;i++){
 const a=Math.random()*Math.PI*2;
 const p=heartPoint(a, Math.min(W,H)*.014);
 particles.push({
  x:p[0]+(Math.random()-.5)*7,y:p[1]+(Math.random()-.5)*7,
  a,phase:Math.random()*6.28,r:Math.random()*1.7+.25,
  drift:Math.random()*.5+.1
 });
}
function drawHeart(t){
 h.clearRect(0,0,W,H);
 const scale=Math.min(W,H)*.014;
 for(const p of particles){
  const target=heartPoint(p.a,scale);
  p.x+=(target[0]-p.x)*.045;
  p.y+=(target[1]-p.y)*.045;
  const glow=.55+.45*Math.sin(t*.003+p.phase);
  h.globalAlpha=.35+.65*glow;
  h.fillStyle= glow>.72 ? '#fff0f5':'#ff477d';
  h.shadowBlur=7;h.shadowColor='#ff174f';
  h.beginPath();h.arc(p.x,p.y,p.r,0,Math.PI*2);h.fill();
 }
 h.shadowBlur=0;
 // soft heart glow
 const rg=h.createRadialGradient(W/2,H/2,10,W/2,H/2,Math.min(W,H)*.3);
 rg.addColorStop(0,'rgba(255,45,105,.11)');rg.addColorStop(1,'rgba(255,0,80,0)');
 h.fillStyle=rg;h.fillRect(0,0,W,H);
 requestAnimationFrame(drawHeart);
}
requestAnimationFrame(drawHeart);

const bursts=[];
function burst(x,y){
 for(let i=0;i<45;i++){
  const a=Math.random()*Math.PI*2, v=Math.random()*3+1;
  bursts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,r:Math.random()*2+1});
 }
}
function drawBursts(){
 for(let i=bursts.length-1;i>=0;i--){
  const p=bursts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.025;p.life-=.018;
  s.globalAlpha=Math.max(0,p.life);s.fillStyle='#ff8eae';
  s.beginPath();s.arc(p.x,p.y,p.r,0,Math.PI*2);s.fill();
  if(p.life<=0)bursts.splice(i,1);
 }
 s.globalAlpha=1;
 requestAnimationFrame(drawBursts);
}
requestAnimationFrame(drawBursts);
</script>
</body>
</html>
